name: Experiment tests and parity

on:
  push:
    branches: [experiment/stop-first]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/stop-first'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Install pinned devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 # v2.4.0
      - name: Green tests
        run: devenv shell bash -lc 'cd green && clojure -X:test'
      - name: Red tests and typecheck
        run: devenv shell bash -lc 'cd red && bun install && bun test && bun run typecheck'
      - name: Blue tests
        run: devenv shell bash -lc 'cd blue && uv sync && uv run python -m pytest -q'
      - name: Byte parity
        run: devenv shell ./scripts/parity.sh
      - name: Launcher resolution
        run: devenv shell ./scripts/launcher.sh
