name: Test, Parity, and Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Install pinned devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 # v2.4.0
      - name: Green tests
        run: devenv shell bash -lc 'cd green && clojure -X:test'
      - name: Red tests and typecheck
        run: devenv shell bash -lc 'cd red && bun install && bun test && bun run typecheck'
      - name: Blue tests
        run: devenv shell bash -lc 'cd blue && uv sync && uv run python -m pytest -q'
      - name: Byte parity
        run: devenv shell ./scripts/parity.sh
      - name: Launcher resolution
        run: devenv shell ./scripts/launcher.sh

  tag:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Create and push tag
        run: |
          count=$(git rev-list --count HEAD)
          tag="1.0.${count}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" = "$local_sha" ]; then
              echo "Tag ${tag} already at ${local_sha}, skipping"
              exit 0
            fi
            # Same revision count, different commit: main's history was
            # rewritten. Overwriting would silently move a tag someone may
            # already have pinned, so stop and let a human decide.
            echo "::error::Tag ${tag} is on origin at ${remote_sha}, but HEAD is ${local_sha}. Refusing to move a published tag."
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
