[project]
name = "package-once-blue"
version = "0.1.0"
description = "Blue/Python implementation of the production ONCE package"
requires-python = ">=3.11"
dependencies = [
  "blue @ git+https://github.com/getcolors/blue.git@290f313ead5ca162875c33a049c880da017eae09",
  "colors-compute-blue>=0.1.0",
]


[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/package_once_blue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
colors-compute-blue = { git = "https://github.com/getcolors/colors-compute.git", rev = "3451a05e719b0ad6809f3c88b241a8c010b8f58b", subdirectory = "blue" }
