[project]
name = "package-once-blue"
version = "0.1.0"
description = "Blue/Python implementation of the production ONCE package"
requires-python = ">=3.11"
dependencies = [
  "blue>=0.1.0",
  "colors-compute-blue>=0.1.0",
]


[dependency-groups]
dev = [
  "blue @ git+https://github.com/getcolors/blue.git@ec33f05543dc7f1d380fd61d40af56362960fcb9",
  "colors-compute-blue @ git+https://github.com/getcolors/colors-compute.git@ae28ea74962bb1897fa6365c143c1d43ac1fe095#subdirectory=blue",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/package_once_blue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
