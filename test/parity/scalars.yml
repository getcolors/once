# Scalars the three colours must agree on.
#
# Green reads YAML through yamlstar, red through Bun.YAML, blue through PyYAML
# with core-schema scalar resolvers. Three parsers, one contract: the same
# colors.yml has to mean the same desired state in every colour. YAML 1.1 —
# which PyYAML and SnakeYAML speak by default — disagrees with the 1.2 core
# schema on most of the lines below, so this is where that would surface.
bare-no: no
bare-yes: yes
bare-on: on
bare-off: off
bare-y: y
bare-n: n
bare-true: true
bare-false: false
upper-true: True
shout-false: FALSE
quoted-no: "no"
quoted-true: "true"
zero-prefixed: 012
plain-int: 587
negative-int: -1
zero: 0
# Whole-valued floats share JavaScript's numeric representation with integers.
hex-like: "0x1f"
quoted-whole-float: "1.0"
whole-float: 1.0
hex-int: 0x1f
octal-int: 0o17
scientific: 1e3
scientific-decimal: 1.0e3
scientific-fraction: 1.25e-2
quoted-scientific: "1e3"
quoted-octal: "0o17"
date-like: 2026-09-11
sexagesimal-float-like: 1:30.5
real-float: 1.5
sexagesimal-like: 1:30
tilde-null: ~
word-null: null
empty-value:
version-like: 1.2.3
dotted: ubuntu-24.04
cidr: 10.0.0.0/24
url: https://example.com/x
positive-infinity: +.INF
negative-infinity: -.Inf
not-a-number: .NaN
