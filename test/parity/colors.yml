# One desired state, read by green, red and blue alike. The parity script
# builds it through all three and compares the generated trees byte for byte,
# so any drift between the colours shows up here first.
profile: parity
workdir: .colors
once:
  applications:
    - host: www.example.com
      image: ghcr.io/example/site:latest
      github: example/site
      env:
        EXAMPLE: app-example
    # Same image, same repository, second host. Deploy keys are per repository,
    # so this and www.example.com share one key whose ForceCommand names both —
    # the case that has to render identically in all three colours.
    - host: www.example.net
      image: ghcr.io/example/site:latest
      github: example/site
