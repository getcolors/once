---
- name: Managed Server Configuration
  hosts: all
  tasks:
    - name: Wait for SSH after compute creation
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Install docker
      ansible.builtin.shell: >-
        curl -fsSL https://get.docker.com -o install-docker.sh
        && sudo sh install-docker.sh
        && rm install-docker.sh
      args:
        creates: /usr/bin/docker
      register: docker_install_result
      until: docker_install_result.rc == 0
      retries: 10
      delay: 10

    - name: Install ONCE
      ansible.builtin.shell: >-
        curl -fsSL https://get.once.com -o install-once.sh
        && ONCE_INTERACTIVE=false sh install-once.sh
        && rm install-once.sh
      args:
        creates: /usr/local/bin/once
      register: once_install_result
      until: once_install_result.rc == 0
      retries: 10
      delay: 10

    - name: Install babashka
      ansible.builtin.shell: >-
        curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
        && chmod +x install
        && sudo ./install
        && rm install
      args:
        creates: /usr/local/bin/bb
      register: bb_install_result
      until: bb_install_result.rc == 0
      retries: 10
      delay: 10

    - name: Create deploy user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        create_home: yes
        state: present
      become: yes

    - name: Grant deploy NOPASSWD sudo for once
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD: /usr/local/bin/once *\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: yes

    - name: Install deploy ForceCommand script
      ansible.builtin.copy:
        src: files/deploy
        dest: /usr/local/bin/deploy
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Install authorized key reconciler
      ansible.builtin.copy:
        src: files/authorized-keys
        dest: /usr/local/bin/once-authorized-keys
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Ensure deploy .ssh directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"
      become: yes

    - name: Ensure ONCE configuration directory
      ansible.builtin.file:
        path: /etc/once
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes

    # Only this generation's keys are rendered, so the artifact stays a pure
    # function of desired state. Retaining the previous generation is the
    # reconciler's job, on the box, where the previous keys actually are.
    - name: Stage current deploy keys
      ansible.builtin.copy:
        src: deploy_keys
        dest: /etc/once/deploy_keys
        owner: root
        group: root
        mode: "0600"
      become: yes

    - name: Reconcile deploy authorized keys
      ansible.builtin.command:
        argv:
          - /usr/local/bin/once-authorized-keys
          - /etc/once/deploy_keys
          - /home/deploy/.ssh/authorized_keys
      register: authorized_keys_result
      changed_when: authorized_keys_result.stdout != "unchanged"
      become: yes

    - name: Own deploy authorized keys
      ansible.builtin.file:
        path: /home/deploy/.ssh/authorized_keys
        owner: deploy
        group: deploy
        mode: "0600"
      become: yes

    - name: Import ONCE tasks
      import_tasks: once.yml
